# docker-compose.yml — site stack (no ports; proxy handles 80/443)
services:
  web:
    build: .
    image: printimpact-web
    container_name: printimpact-web          # used by the proxy to reach this service
    env_file: .env.local
    environment:
      - PORT=3000                       # your app must listen on this
    expose:
      - "3000"                           # expose ONLY to the proxy network
    restart: unless-stopped
    networks: [web]
    healthcheck:
      # Requires wget in the image (alpine busybox provides it).
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s

networks:
  web:
    external: true   # created once: `docker network create web`
